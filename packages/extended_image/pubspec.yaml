name: extended_image
description: Custom image widget for Boorusama.
publish_to: 'none' 

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

resolution: workspace

dependencies:
  cache_manager:
    path: ../cache_manager
  dio: ^5.7.0
  equatable: ^2.0.7
  extended_image_library:
    git:
      url: https://github.com/khoadng/extended_image_library.git
      ref: fork
  flutter:
    sdk: flutter
  flutter_libavif: ^0.1.0
  path: ^1.8.3
  path_provider: ^2.1.2
  retriable:
    path: ../retriable

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

dependency_overrides:
  # libavif 0.1.0 still declares hooks 1.x, but its build hook is compatible
  # with hooks 2.x. Keep the workspace's other native-asset packages current.
  hooks: ^2.0.0
