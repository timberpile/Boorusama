name: Audit Pixiv verification

on:
  push:
    branches:
      - maintenance/develop-comprehensive-audit-20261110
    paths:
      - .github/workflows/audit-pixiv-verification.yml

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BOORUSAMA_USE_FVM: "true"
      CI: "true"
      FVM_CACHE_PATH: /home/runner/.cache/fvm
    steps:
      - name: Check out exact reproducer
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: 1c014e59ef45dc56dc1b0dc30882a3eb9df6219d
          persist-credentials: false
      - name: Prepare evidence directory
        run: |
          mkdir -p .worktrees/_artifacts/165-verification
          git rev-parse HEAD > .worktrees/_artifacts/165-verification/candidate.sha
      - name: Install pinned native FVM
        shell: bash
        run: |
          set -euo pipefail
          tools="$PWD/.worktrees/_artifacts/165-verification/tools"
          mkdir -p "$tools"
          curl --fail --location --retry 3 \
            https://github.com/btwld/fvm/releases/download/4.3.1/fvm-4.3.1-linux-x64.tar.gz \
            --output "$tools/fvm.tar.gz"
          echo "ad59c861bdbef80c9f262d30ab28debd374afad0ef4b10b99a47bbab77e08bde  $tools/fvm.tar.gz" | sha256sum --check
          tar -xzf "$tools/fvm.tar.gz" -C "$tools"
          binary="$(find "$tools" -type f -name fvm -print -quit)"
          test -n "$binary"
          chmod +x "$binary"
          dirname "$binary" >> "$GITHUB_PATH"
          "$binary" --version
      - name: Restore FVM and dependency cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            /home/runner/.cache/fvm
            ~/.pub-cache
          key: audit-fvm-3.47.2-${{ runner.os }}-${{ hashFiles('pubspec.lock', 'packages/boorusama_cli/pubspec.lock') }}
      - name: Initialize pinned workspace
        shell: bash
        run: |
          set -euo pipefail
          cp .env.example .env
          ./init.sh 2>&1 | tee .worktrees/_artifacts/165-verification/init.log
          fvm flutter --version
      - name: Run regression reproducer
        shell: bash
        run: |
          set -euo pipefail
          fvm flutter test --no-pub --reporter expanded \
            test/core/content/pixiv_media_request_regression_test.dart \
            test/core/images/image_failure_diagnostics_test.dart \
            2>&1 | tee .worktrees/_artifacts/165-verification/regression.log
      - name: Format test sources for the next candidate
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          fvm dart format test/core/content/pixiv_media_request_regression_test.dart test/core/images/image_failure_diagnostics_test.dart
          mkdir -p .worktrees/_artifacts/165-verification/formatted
          cp test/core/content/pixiv_media_request_regression_test.dart test/core/images/image_failure_diagnostics_test.dart .worktrees/_artifacts/165-verification/formatted/
      - name: Preserve exact-candidate evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pixiv-reproducer-evidence
          path: |
            .worktrees/_artifacts/165-verification/*.log
            .worktrees/_artifacts/165-verification/*.sha
            .worktrees/_artifacts/165-verification/formatted/
          if-no-files-found: error
          retention-days: 14
