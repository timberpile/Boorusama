name: Verify 144 sync candidate

on:
  push:
    branches: [feature/144-folder-based-collection-sync]
    paths:
      - .github/workflows/144-verify-once.yml
      - lib/core/backups/folder_sync/**
      - test/core/backups/folder_sync/**
      - pubspec.yaml
      - pubspec.lock

permissions:
  contents: read

concurrency:
  group: verify-144-sync-candidate
  cancel-in-progress: false

jobs:
  host-tests:
    if: github.repository == 'timberpile/Boorusama'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BOORUSAMA_USE_FVM: 'false'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.47.2
          cache: true
      - name: Native host prerequisites
        run: sudo apt-get update && sudo apt-get install -y meson nasm
      - name: Resolve dependencies and generate sources
        run: ./init.sh
      - name: Analyze sync foundation
        id: analysis
        continue-on-error: true
        run: flutter analyze --no-pub lib/core/backups/folder_sync test/core/backups/folder_sync
      - name: Run all sync foundation tests
        id: tests
        continue-on-error: true
        run: |
          workers="$(python3 scripts/physical_core_count.py)"
          flutter test --no-pub "--concurrency=$workers" --reporter=expanded test/core/backups/folder_sync
      - name: Summarize actual outcomes
        if: always()
        env:
          ANALYSIS_RESULT: ${{ steps.analysis.outcome }}
          TEST_RESULT: ${{ steps.tests.outcome }}
        run: |
          printf 'Analysis: %s\nSync tests: %s\n' "$ANALYSIS_RESULT" "$TEST_RESULT"
          [ "$ANALYSIS_RESULT" = success ] && [ "$TEST_RESULT" = success ]
