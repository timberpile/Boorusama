name: Polish and verify 144 foundation

on:
  push:
    branches: [feature/144-folder-based-collection-sync]
    paths: [.github/workflows/144-polish-once.yml]

permissions:
  contents: write

jobs:
  foundation:
    if: github.repository == 'timberpile/Boorusama'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BOORUSAMA_USE_FVM: 'false'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.47.2
          cache: true
      - name: Native host prerequisites
        run: sudo apt-get update -qq && sudo apt-get install -y -qq meson nasm
      - name: Resolve and generate
        run: ./init.sh > "$RUNNER_TEMP/144-init.log" 2>&1 || { tail -80 "$RUNNER_TEMP/144-init.log"; exit 1; }
      - name: Apply narrowly scoped analyzer fixes and format
        shell: bash
        run: |
          set -euo pipefail
          dart fix --apply --code=sort_unnamed_constructors_first,unnecessary_await_in_return,avoid_init_to_null,prefer_const_declarations lib/core/backups/folder_sync
          dart fix --apply --code=sort_unnamed_constructors_first,unnecessary_await_in_return,avoid_init_to_null,prefer_const_declarations test/core/backups/folder_sync
          python3 - <<'PY'
          from pathlib import Path
          for name in ['lib/core/backups/folder_sync/storage.dart', 'test/core/backups/folder_sync/storage_v5_test.dart']:
              path = Path(name)
              text = path.read_text()
              if '// ignore_for_file: avoid_slow_async_io' not in text:
                  path.write_text('// Shared-directory checks must not block the UI isolate; keep async I/O.\n// ignore_for_file: avoid_slow_async_io\n\n' + text)
          PY
          dart format lib/core/backups/folder_sync test/core/backups/folder_sync
      - name: Validate scope and commit generated dependency lock
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, re, subprocess
          changed = subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines()
          allowed = lambda p: p == 'pubspec.lock' or p.startswith(('lib/core/backups/folder_sync/', 'test/core/backups/folder_sync/'))
          assert all(allowed(p) for p in changed), changed
          path = pathlib.Path('pubspec.lock')
          before = subprocess.check_output(['git', 'show', 'HEAD:pubspec.lock'], text=True)
          after = path.read_text()
          pattern = re.compile(r'^  cryptography:\n(?:(?:    .*|\s*)\n)*', re.M)
          assert len(pattern.findall(after)) == 1, 'Expected one resolved cryptography dependency'
          assert pattern.sub('', before) == pattern.sub('', after), 'Unexpected unrelated lockfile edits'
          print('Verified scope: foundation files and only cryptography lock entry.')
          PY
          git diff --check
          git diff --stat
          git diff -- pubspec.lock
          git add lib/core/backups/folder_sync test/core/backups/folder_sync pubspec.lock
          git rm .github/workflows/144-polish-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: format sync foundation and lock cryptography (Refs #144)'
          git push origin HEAD:refs/heads/feature/144-folder-based-collection-sync
          echo "Tested candidate: $(git rev-parse HEAD)"
      - name: Analyze sync foundation
        id: analysis
        continue-on-error: true
        run: flutter analyze --no-pub lib/core/backups/folder_sync test/core/backups/folder_sync
      - name: Run sync regressions
        id: tests
        continue-on-error: true
        run: |
          workers="$(python3 scripts/physical_core_count.py)"
          flutter test --no-pub "--concurrency=$workers" --reporter=expanded test/core/backups/folder_sync
      - name: Summarize actual outcomes
        if: always()
        env:
          ANALYSIS_RESULT: ${{ steps.analysis.outcome }}
          TEST_RESULT: ${{ steps.tests.outcome }}
        run: |
          printf 'Analysis: %s\nSync tests: %s\n' "$ANALYSIS_RESULT" "$TEST_RESULT"
          [ "$ANALYSIS_RESULT" = success ] && [ "$TEST_RESULT" = success ]
