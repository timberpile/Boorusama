name: Transfer offline audit tooling
on:
  push:
    branches: [maintenance/develop-comprehensive-audit-20261110]
    paths: [.github/workflows/audit-test-toolchain-parts.yml]
permissions:
  contents: read
  actions: read
jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Retrieve the verified environment archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: offline-audit-test-environment
          run-id: 42923323722
          github-token: ${{ github.token }}
          path: .worktrees/_artifacts/environment-parts
      - name: Verify and split for the connector's 512 MiB limit
        shell: bash
        run: |
          set -euo pipefail
          cd .worktrees/_artifacts/environment-parts
          hash="$(cut -d' ' -f1 SHA256SUMS)"
          echo "$hash  test-environment.tar.zst" | sha256sum -c
          split --bytes=450M --numeric-suffixes=0 --suffix-length=2 test-environment.tar.zst environment.part
          test ! -e environment.part04
          sha256sum environment.part* > PARTS.sha256
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: offline-environment-00
          path: |
            .worktrees/_artifacts/environment-parts/environment.part00
            .worktrees/_artifacts/environment-parts/PARTS.sha256
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: offline-environment-01
          path: |
            .worktrees/_artifacts/environment-parts/environment.part01
            .worktrees/_artifacts/environment-parts/PARTS.sha256
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: offline-environment-02
          path: |
            .worktrees/_artifacts/environment-parts/environment.part02
            .worktrees/_artifacts/environment-parts/PARTS.sha256
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: offline-environment-03
          path: |
            .worktrees/_artifacts/environment-parts/environment.part03
            .worktrees/_artifacts/environment-parts/PARTS.sha256
          compression-level: 0
          retention-days: 1
