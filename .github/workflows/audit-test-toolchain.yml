name: Prepare offline audit test environment
on:
  push:
    branches: [maintenance/develop-comprehensive-audit-20261110]
    paths: [.github/workflows/audit-test-toolchain.yml]
permissions:
  contents: read
jobs:
  environment:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      BOORUSAMA_USE_FVM: "true"
      CI: "true"
      FVM_CACHE_PATH: /home/runner/.cache/fvm
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: 2e2ea428ba323706e37a65e45903d3959df439d4
          persist-credentials: false
      - name: Install pinned tooling
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .worktrees/_artifacts/offline/tools
          cd .worktrees/_artifacts/offline/tools
          curl --fail --location --retry 3 https://github.com/btwld/fvm/releases/download/4.3.1/fvm-4.3.1-linux-x64.tar.gz -o fvm.tar.gz
          echo 'ad59c861bdbef80c9f262d30ab28debd374afad0ef4b10b99a47bbab77e08bde  fvm.tar.gz' | sha256sum -c
          tar -xzf fvm.tar.gz
          binary="$(find "$PWD" -type f -name fvm -print -quit)"
          chmod +x "$binary"
          dirname "$binary" >> "$GITHUB_PATH"
          sudo apt-get update
          sudo apt-get install --yes meson nasm
      - name: Restore initialized SDK and dependencies
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            /home/runner/.cache/fvm
            ~/.pub-cache
          key: audit-fvm-3.47.2-${{ runner.os }}-${{ hashFiles('pubspec.lock', 'packages/boorusama_cli/pubspec.lock') }}
      - name: Initialize pinned workspace
        shell: bash
        run: |
          set -euo pipefail
          cp .env.example .env
          ./init.sh
          fvm flutter --version
          fvm flutter precache --linux
      - name: Preserve relocatable test environment
        shell: bash
        run: |
          set -euo pipefail
          evidence="$PWD/.worktrees/_artifacts/offline"
          mkdir -p "$evidence/bootstrap" "$evidence/export"
          cp --parents .dart_tool/package_config.json packages/boorusama_cli/.dart_tool/package_config.json "$evidence/bootstrap/"
          git ls-files --others --exclude-standard > "$evidence/untracked.txt"
          find lib packages -type f \( -name '*.g.dart' -o -name 'strings_*.g.dart' \) -print0 > "$evidence/generated-files"
          tar -cf "$evidence/bootstrap/generated.tar" --null -T "$evidence/generated-files"
          cp /usr/bin/meson /usr/bin/nasm "$evidence/tools/"
          cp -a /usr/lib/python3/dist-packages/mesonbuild "$evidence/tools/"
          du -sh "$FVM_CACHE_PATH" "$HOME/.pub-cache"
          tar -I 'zstd -T0 -6' -cf "$evidence/export/test-environment.tar.zst" \
            -C /home/runner .cache/fvm .pub-cache \
            -C "$evidence" tools bootstrap
          sha256sum "$evidence/export/test-environment.tar.zst" > "$evidence/export/SHA256SUMS"
          du -h "$evidence/export/test-environment.tar.zst"
      - name: Preserve environment for the isolated audit workspace
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: offline-audit-test-environment
          path: .worktrees/_artifacts/offline/export/
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
