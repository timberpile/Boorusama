name: Final sync foundation checks

on:
  push:
    branches: [feature/144-folder-based-collection-sync]
    paths: [.github/workflows/144-final-check.yml]

permissions:
  contents: write

jobs:
  foundation:
    if: github.repository == 'timberpile/Boorusama'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BOORUSAMA_USE_FVM: 'false'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.47.2
          cache: true
      - name: Host prerequisites
        run: sudo apt-get update -qq && sudo apt-get install -y -qq meson nasm
      - name: Generate sources
        run: ./init.sh > "$RUNNER_TEMP/init.log" 2>&1 || { tail -60 "$RUNNER_TEMP/init.log"; exit 1; }
      - name: Apply remaining demonstrated lint corrections
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('test/core/backups/folder_sync/revision_transport_test.dart')
          text = path.read_text()
          assert text.count('  Object? failure;') == 1
          path.write_text(text.replace('  Object? failure;', '  Error? failure;'))
          PY
          dart fix --apply --code=curly_braces_in_flow_control_structures,unnecessary_async lib/core/backups/folder_sync
          dart format lib/core/backups/folder_sync test/core/backups/folder_sync
          python3 - <<'PY'
          import subprocess
          paths = subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines()
          assert all(p.startswith(('lib/core/backups/folder_sync/', 'test/core/backups/folder_sync/')) for p in paths), paths
          PY
          git diff --check
          git add lib/core/backups/folder_sync test/core/backups/folder_sync
          git rm .github/workflows/144-final-check.yml .github/workflows/144-verify-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: finish sync foundation lint corrections (Refs #144)'
          git push origin HEAD:refs/heads/feature/144-folder-based-collection-sync
          echo "Tested candidate: $(git rev-parse HEAD)"
      - name: Analyze sync foundation
        id: analysis
        continue-on-error: true
        run: flutter analyze --no-pub lib/core/backups/folder_sync test/core/backups/folder_sync
      - name: Verify formatting and dependency lock
        id: format
        continue-on-error: true
        run: |
          dart format --output=none --set-exit-if-changed lib/core/backups/folder_sync test/core/backups/folder_sync
          git diff --exit-code -- pubspec.lock
      - name: Run complete sync foundation tests
        id: tests
        continue-on-error: true
        run: |
          workers="$(python3 scripts/physical_core_count.py)"
          flutter test --no-pub "--concurrency=$workers" --reporter=expanded test/core/backups/folder_sync
      - name: Report actual outcomes
        if: always()
        env:
          ANALYSIS: ${{ steps.analysis.outcome }}
          FORMAT: ${{ steps.format.outcome }}
          TESTS: ${{ steps.tests.outcome }}
        run: |
          printf 'Analysis: %s\nFormat and lock: %s\nSync tests: %s\n' "$ANALYSIS" "$FORMAT" "$TESTS"
          [ "$ANALYSIS" = success ] && [ "$FORMAT" = success ] && [ "$TESTS" = success ]
