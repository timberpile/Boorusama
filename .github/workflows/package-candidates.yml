name: Isolated package candidates
on:
  push:
    branches: [maintenance/package-extraction-2026-11-09]
    paths: [.github/workflows/package-candidates.yml, .github/package-work/**]
permissions:
  contents: read
concurrency:
  group: package-candidates
  cancel-in-progress: false
jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      matrix: ${{ steps.assembly.outputs.matrix }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - id: assembly
        run: python3 .github/package-work/assemble.py
      - uses: actions/upload-artifact@v4
        with:
          name: package-assembly
          path: package-assembly.json
          retention-days: 7
  verify:
    needs: assemble
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.assemble.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BOORUSAMA_USE_FVM: 'true'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ matrix.sha }}
          persist-credentials: false
      - id: flutter
        run: echo "version=$(jq -er '.flutter' .fvmrc)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: ${{ steps.flutter.outputs.version }}
          cache: true
      - name: Set up FVM
        run: |
          dart pub global activate fvm 4.3.1
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"
      - name: Native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev meson nasm
      - name: Initialize
        run: ./init.sh
      - name: Analyze candidate
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p .worktrees/_artifacts/qualification
          fvm flutter analyze --no-pub --no-fatal-infos lib packages 2>&1 | tee .worktrees/_artifacts/qualification/analyze.log
      - name: Targeted package tests
        env:
          PACKAGE: ${{ matrix.id }}
        run: |
          set -o pipefail
          mkdir -p .worktrees/_artifacts/qualification
          tests='test/core/bookmarks/server_favorites'
          if [ "$PACKAGE" != p2 ]; then tests="$tests test/core/content"; fi
          if [[ "$PACKAGE" =~ ^p[4567]$ ]]; then tests="$tests test/core/bookmarks test/core/backups test/application/bookmark_profile_availability_test.dart"; fi
          fvm flutter test --no-pub --concurrency=2 $tests 2>&1 | tee .worktrees/_artifacts/qualification/tests.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qualification-${{ matrix.id }}
          path: .worktrees/_artifacts/qualification/
          retention-days: 7
          if-no-files-found: warn
