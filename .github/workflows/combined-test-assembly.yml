name: Assemble isolated combined test candidate
on:
  push:
    branches: [maintenance/combined-testing-2026-11-08]
    paths: [.github/workflows/combined-test-assembly.yml]
permissions:
  contents: write
concurrency:
  group: combined-test-assembly-2026-11-08
  cancel-in-progress: false
jobs:
  assemble:
    if: github.repository == 'timberpile/Boorusama'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      BOOTSTRAP_SHA: ${{ github.sha }}
      TARGET_BRANCH: maintenance/combined-testing-2026-11-08
    steps:
      - name: Merge frozen inputs without modifying task branches
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, json, os, pathlib, subprocess
          repo = 'timberpile/Boorusama'
          branch = os.environ['TARGET_BRANCH']
          bootstrap = os.environ['BOOTSTRAP_SHA']
          baseline = '8672cf2ba235fbc810bbcf3296efef1eb4410a37'
          inputs = [
              ('develop', '266a14c0f87f29213d48696bda7c806dc1d05b6e'),
              ('feature/140-pixiv-work-viewer', 'd7298c5a06883977966421aec0d11ecf4d2564e4'),
              ('feature/141-pixiv-work-page-bookmarks', '01fa085840f8442246505b1ad1d883e01a4fecdb'),
              ('feature/157-native-nhentai-galleries', 'cf71fb22e142564d96a1f25cce85a48898ec52fc'),
              ('feature/162-unified-page-prefetch', 'dfe1c4690b1dc91d8bc4dc38321be478fac8fa11'),
              ('bug/161-pixiv-explore-pagination', 'db54e43bb38e3d997136c52c3434c35342737df3'),
              ('feature/160-viewport-thumbnail-prefetch', 'd13e06592cd5d6153d70d672d42fa089071940bb'),
              ('feature/144-folder-based-collection-sync', '4dbc9f08adb8bcbce17877d71d80a57ba475243c'),
              ('feature/136-kurumi-ui-design-system', '1cb65e313d1ed2d9071553a05941f56784f36c6a'),
              ('maintenance/content-architecture-design', 'fdb68f657284e1f76701c83683aa0228484d09c8'),
          ]
          predecessors = {
              'feature/132-preserve-favorites-sync-group-contents': '32ebbcc6f41347f8f40275d4912a2f7012b75549',
              'maintenance/154-content-group-contracts': 'f3bb2d30b92116dff44dac8fc6aceabbc67a3d14',
              'maintenance/155-unified-bookmark-storage': 'f6deb27590a38a812c532c939085742886cdda3f',
              'feature/158-unified-bookmark-hierarchy': 'b9405fdbd5312a797d8165d556d48785d183881d',
              'feature/55-undo-reversible-actions': '482ae4b1e5fd1e34b344a5c61959a210b8527281',
          }
          def git(*args, check=True):
              result = subprocess.run(['git', *args], text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
              if result.stdout: print(result.stdout, end='', flush=True)
              if check and result.returncode:
                  raise RuntimeError('git command failed: ' + ' '.join(args))
              return result
          git('init', '.')
          git('remote', 'add', 'origin', 'https://github.com/' + repo + '.git')
          token = base64.b64encode(('x-access-token:' + os.environ['GH_TOKEN']).encode()).decode()
          subprocess.run(['git', 'config', 'http.https://github.com/.extraheader', 'AUTHORIZATION: basic ' + token], check=True)
          git('config', 'user.name', 'github-actions[bot]')
          git('config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com')
          git('fetch', '--no-tags', 'origin', bootstrap, baseline, *(sha for _, sha in inputs), *predecessors.values())
          git('checkout', '-B', branch, bootstrap)
          resolutions = []
          for name, sha in inputs:
              print('ASSEMBLE', name, sha, flush=True)
              merge = git('merge', '--no-ff', '--no-edit', '-m', 'test: combine ' + name + ' at ' + sha[:9], sha, check=False)
              if merge.returncode:
                  paths = git('diff', '--name-only', '--diff-filter=U').stdout.splitlines()
                  for path in paths:
                      if name == 'feature/136-kurumi-ui-design-system' and (path == 'AGENTS.md' or path.startswith('docs/')):
                          git('checkout', '--ours', '--', path)
                          git('add', '--', path)
                          resolutions.append({'input': name, 'path': path, 'resolution': 'Keep newer #156 documentation'})
                  remaining = git('diff', '--name-only', '--diff-filter=U').stdout.splitlines()
                  if remaining:
                      print('UNRESOLVED_CONFLICTS ' + json.dumps(remaining), flush=True)
                      for path in remaining:
                          print('CONFLICT_DIFF ' + path, flush=True)
                          git('diff', '--cc', '--', path)
                      raise RuntimeError('No candidate published: unresolved integration conflicts')
                  git('diff', '--cached', '--check')
                  git('commit', '--no-edit')
          for name, sha in inputs:
              git('merge-base', '--is-ancestor', sha, 'HEAD')
          inherited = {name: {'sha': sha, 'ancestor': git('merge-base', '--is-ancestor', sha, 'HEAD', check=False).returncode == 0} for name, sha in predecessors.items()}
          git('diff', '--exit-code', baseline, 'HEAD', '--',
              'lib/core/content/content_media_access.dart',
              'lib/core/content/content_access_provider.dart',
              'lib/core/bookmarks/src/widgets/bookmark_local_group_card.dart')
          git('restore', '--source=' + baseline, '--staged', '--worktree', 'AGENTS.md')
          old_design = pathlib.Path('docs/designs/2026-11-05-work-page-action-options.md')
          old_design.write_text('\n'.join(line.rstrip() for line in old_design.read_text().splitlines()) + '\n')
          git('add', str(old_design))
          git('rm', '.github/workflows/combined-test-assembly.yml')
          path = pathlib.Path('docs/handoffs/combined-testing-2026-11-08.json')
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps({'baseline': baseline, 'inputs': dict(inputs),
              'predecessors': inherited, 'resolutions': resolutions,
              'guidance': 'Current #156 AGENTS.md takes precedence over historical planning additions.',
              'flutter_tests_run': False,
              'purpose': 'Isolated integration candidate, not develop or release approval'}, indent=2) + '\n')
          git('add', str(path))
          git('diff', '--cached', '--check')
          git('commit', '-m', 'test: record combined candidate and remove assembly workflow (Refs #140, #141, #156, #157, #160, #161, #162)')
          git('diff', '--check', baseline, 'HEAD')
          remote = git('ls-remote', 'origin', 'refs/heads/' + branch).stdout.split()[0]
          if remote != bootstrap: raise RuntimeError('Target branch changed; refusing to publish over it')
          git('push', 'origin', 'HEAD:refs/heads/' + branch)
          print('COMBINED_CANDIDATE_SHA ' + git('rev-parse', 'HEAD').stdout.strip(), flush=True)
          PY
