# Task-local verification helper. Remove before integrating POST-009.
name: POST-009 verification

on:
  push:
    branches: [feature/POST-009-boorusama-links]

permissions:
  contents: read

concurrency:
  group: post009-verification
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Archive tracked task sources
        run: git archive --format=tar.gz HEAD -o "$RUNNER_TEMP/post009-source.tar.gz"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: post009-source
          path: ${{ runner.temp }}/post009-source.tar.gz
          retention-days: 1
          if-no-files-found: error
