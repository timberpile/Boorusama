# Task-local verification helper. Remove before integrating POST-009.
name: POST-009 verification
on:
  push:
    branches: [feature/POST-009-boorusama-links]
permissions:
  contents: read
concurrency:
  group: post009-verification
  cancel-in-progress: true
jobs:
  validation:
    if: github.repository == 'timberpile/Boorusama' && github.ref == 'refs/heads/feature/POST-009-boorusama-links'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BOORUSAMA_USE_FVM: 'true'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Read pinned Flutter version
        id: flutter
        run: echo "version=$(jq -er '.flutter' .fvmrc)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: ${{ steps.flutter.outputs.version }}
          cache: true
      - name: Set up FVM
        run: |
          dart pub global activate fvm 4.3.1
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"
      - name: Install native test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev meson nasm
      - name: Initialize dependencies and generated sources
        run: ./init.sh
      - name: Record checked source
        run: git rev-parse HEAD | tee "$RUNNER_TEMP/post009-checked.txt"
      - name: Analyze implementation and tests
        run: |
          set -o pipefail
          fvm flutter analyze --no-pub --no-fatal-infos lib/core/posts/links lib/core/posts/shares lib/core/routers lib/foundation/clipboard.dart test/core/posts/links test/core/posts/shares/share_boorusama_link_test.dart | tee "$RUNNER_TEMP/post009-analysis.log"
      - name: Test post links, sharing and clipboard
        run: |
          set -o pipefail
          fvm flutter test --no-pub --reporter=expanded --concurrency="$(python3 scripts/physical_core_count.py)" test/core/posts/links test/core/posts/shares test/foundation | tee "$RUNNER_TEMP/post009-tests.log"
      - name: Complete regression suite
        run: |
          set -o pipefail
          scripts/run_regression_tests.sh | tee "$RUNNER_TEMP/post009-regression.log"
      - name: Archive checked source
        if: always()
        run: git archive --format=tar.gz HEAD -o "$RUNNER_TEMP/post009-source.tar.gz"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: post009-verification
          path: |
            ${{ runner.temp }}/post009-source.tar.gz
            ${{ runner.temp }}/post009-checked.txt
            ${{ runner.temp }}/post009-*.log
          retention-days: 1
          if-no-files-found: error
