# Temporary task helper; remove before integration.
name: POST-009 verification
on:
  push:
    branches: [feature/POST-009-boorusama-links]
permissions:
  actions: read
  contents: read
jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Collect completed test diagnostics
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api repos/timberpile/Boorusama/actions/jobs/116716136955/logs > "$RUNNER_TEMP/post009-test.log"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: post009-diagnostics
          path: ${{ runner.temp }}/post009-test.log
          retention-days: 1
          if-no-files-found: error
