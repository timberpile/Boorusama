# Task-local verification helper. Remove before integrating POST-009.
name: POST-009 verification
on:
  push:
    branches: [feature/POST-009-boorusama-links]
permissions:
  contents: write
concurrency:
  group: post009-verification
  cancel-in-progress: true
jobs:
  validation:
    if: github.repository == 'timberpile/Boorusama' && github.ref == 'refs/heads/feature/POST-009-boorusama-links'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BOORUSAMA_USE_FVM: 'true'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Read pinned Flutter version
        id: flutter
        run: echo "version=$(jq -er '.flutter' .fvmrc)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ steps.flutter.outputs.version }}
          cache: true
      - name: Set up FVM
        run: |
          dart pub global activate fvm 4.3.1
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"
      - name: Install native test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev meson nasm
      - name: Apply task patch when supplied
        run: |
          if test -f .github/post009.patch; then
            git apply --check .github/post009.patch
            git apply --index .github/post009.patch
            git rm .github/post009.patch
          fi
      - name: Initialize dependencies and generated sources
        run: ./init.sh
      - name: Format and commit only the isolated task candidate
        run: |
          if ! git diff --cached --quiet; then
            git diff --cached --name-only --diff-filter=ACM -z -- '*.dart' | xargs -0 -r fvm dart format
            git add -u
            git config user.name 'Boorusama task verification'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'feat: implement portable Boorusama post links'
            git push origin HEAD:refs/heads/feature/POST-009-boorusama-links
          fi
          echo "Checked source: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - name: Analyze source
        run: fvm flutter analyze --no-pub --no-fatal-infos lib/core/posts/links lib/core/posts/shares lib/core/routers lib/foundation/clipboard.dart
      - name: Test post links, sharing and clipboard
        run: |
          fvm flutter test --no-pub --concurrency="$(python3 scripts/physical_core_count.py)" test/core/posts/links test/core/posts/shares test/foundation
      - name: Archive checked task source
        if: always()
        run: git archive --format=tar.gz HEAD -o "$RUNNER_TEMP/post009-source.tar.gz"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: post009-source
          path: ${{ runner.temp }}/post009-source.tar.gz
          retention-days: 1
          if-no-files-found: error
