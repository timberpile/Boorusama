name: Verify reconciled sync foundation

on:
  push:
    branches: [feature/144-folder-based-collection-sync]
    paths: [.github/workflows/144-acceptance-check.yml]

permissions:
  contents: read

jobs:
  host:
    if: github.repository == 'timberpile/Boorusama'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BOORUSAMA_USE_FVM: 'false'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.47.2
          cache: true
      - name: Host prerequisites
        run: sudo apt-get update -qq && sudo apt-get install -y -qq meson nasm
      - name: Generate sources
        run: ./init.sh > "$RUNNER_TEMP/init.log" 2>&1 || { tail -60 "$RUNNER_TEMP/init.log"; exit 1; }
      - name: Verify source, formatting and lock
        id: format
        continue-on-error: true
        run: |
          git rev-parse HEAD
          dart format --output=none --set-exit-if-changed lib/core/backups/folder_sync test/core/backups/folder_sync
          git diff --exit-code -- pubspec.lock
      - name: Analyze foundation and shared button
        id: analysis
        continue-on-error: true
        run: flutter analyze --no-pub lib/core/backups/folder_sync test/core/backups/folder_sync packages/kurumi/lib/src/components/action_icon_button.dart packages/kurumi/test/action_icon_button_test.dart
      - name: Sync foundation tests
        id: sync
        continue-on-error: true
        run: |
          workers="$(python3 scripts/physical_core_count.py)"
          flutter test --no-pub "--concurrency=$workers" --reporter=expanded test/core/backups/folder_sync
      - name: Complete Kurumi suite
        id: kurumi
        continue-on-error: true
        run: |
          workers="$(python3 scripts/physical_core_count.py)"
          cd packages/kurumi
          flutter test --no-pub "--concurrency=$workers" --reporter=expanded
      - name: Actual outcomes
        if: always()
        env:
          FORMAT: ${{ steps.format.outcome }}
          ANALYSIS: ${{ steps.analysis.outcome }}
          SYNC: ${{ steps.sync.outcome }}
          KURUMI: ${{ steps.kurumi.outcome }}
        run: |
          printf 'Format/lock: %s\nAnalysis: %s\nSync: %s\nKurumi: %s\n' "$FORMAT" "$ANALYSIS" "$SYNC" "$KURUMI"
          for result in "$FORMAT" "$ANALYSIS" "$SYNC" "$KURUMI"; do
            [ "$result" = success ] || exit 1
          done
