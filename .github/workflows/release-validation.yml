name: Validate release

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validation:
    name: Release validation
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BOORUSAMA_USE_FVM: "true"
    steps:
      - name: Check out release candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Read pinned Flutter version
        id: flutter
        run: echo "version=$(jq -er '.flutter' .fvmrc)" >> "$GITHUB_OUTPUT"

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ steps.flutter.outputs.version }}
          cache: true

      - name: Set up FVM
        run: |
          dart pub global activate fvm 4.3.1
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev meson nasm

      - name: Initialize dependencies and generated code
        run: ./init.sh

      - name: Analyze application and workspace
        # Root tests have existing cast warnings; they are compiled/run below.
        # Informational lints remain visible; source warnings and errors fail.
        run: fvm flutter analyze --no-pub --no-fatal-infos lib packages

      - name: Analyze CLI
        working-directory: packages/boorusama_cli
        run: fvm dart analyze

      - name: Test application
        run: fvm flutter test --no-pub --concurrency=2

      - name: Test CLI
        working-directory: packages/boorusama_cli
        run: fvm dart test

      - name: Test repository tooling
        run: |
          .github/scripts/test-pull-request-policy.sh
          .github/scripts/test-android-release-scripts.sh
