name: Prepare audit workspace

on:
  push:
    branches:
      - maintenance/develop-comprehensive-audit-20261110
    paths:
      - .github/workflows/audit-workspace.yml

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out pinned audit source and shared history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: 2e2ea428ba323706e37a65e45903d3959df439d4
          fetch-depth: 0
          persist-credentials: false
      - name: Preserve source history for isolated review
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 2e2ea428ba323706e37a65e45903d3959df439d4
          mkdir -p .worktrees/_artifacts/audit-source
          git bundle create .worktrees/_artifacts/audit-source/repository.bundle --all HEAD
          git bundle verify .worktrees/_artifacts/audit-source/repository.bundle
          git for-each-ref --format='%(refname) %(objectname)' > .worktrees/_artifacts/audit-source/refs.txt
          git rev-parse HEAD > .worktrees/_artifacts/audit-source/develop-source.sha
      - name: Preserve review source
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: audit-source-history
          path: .worktrees/_artifacts/audit-source/
          if-no-files-found: error
          retention-days: 7
