name: Prepare performance diagnostics task branch

on:
  push:
    branches: [fix/cache-performance-diagnostics]
    paths:
      - '.agents/handoffs/performance-diagnostics/**'
      - '.github/workflows/prepare-performance-diagnostics.yml'

# One-time source integration only. No PR, release, shared-branch update or SDK
# installation. This workflow deletes itself in the resulting task commit.
permissions:
  contents: write
concurrency:
  group: prepare-performance-diagnostics-task
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'timberpile/Boorusama' && github.ref == 'refs/heads/fix/cache-performance-diagnostics'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out this exact preparation commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, as pinned by this repository
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Apply diagnostics in an isolated worktree and publish only this task branch
        shell: bash
        run: |
          set -euo pipefail
          branch=fix/cache-performance-diagnostics
          test "$GITHUB_REF" = "refs/heads/$branch"
          test -f .agents/handoffs/performance-diagnostics/apply.py
          remote_head=$(git ls-remote origin "refs/heads/$branch" | cut -f1)
          test "$remote_head" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git worktree add -b "$branch" "$RUNNER_TEMP/boorusama-performance" "$GITHUB_SHA"
          cd "$RUNNER_TEMP/boorusama-performance"
          python3 -m unittest discover -s .agents/handoffs/performance-diagnostics/tests -v
          python3 .agents/handoffs/performance-diagnostics/apply.py . --check
          python3 .agents/handoffs/performance-diagnostics/apply.py .
          git diff --check
          python3 -m unittest discover -s scripts/tests -p test_analyze_performance.py -v
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess
          bundle = Path('.agents/handoffs/performance-diagnostics')
          manifest = json.loads((bundle / 'integration.json').read_text())
          expected = set(manifest['edits']) | {
              p.relative_to(bundle / 'files').as_posix()
              for p in (bundle / 'files').rglob('*') if p.is_file()
          }
          changed = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          changed |= set(subprocess.check_output(['git', 'ls-files', '--others', '--exclude-standard'], text=True).splitlines())
          if changed != expected:
              raise SystemExit('Unexpected integration paths: ' + repr(changed ^ expected))
          receipt = {
              'base_commit': manifest['base_commit'],
              'preparation_commit': os.environ['GITHUB_SHA'],
              'source_integration': 'applied; not Flutter-verified',
              'source_changes': len(expected),
              'checks': ['base input blobs', 'all source anchors', 'new-file destinations',
                         '13 installer tests', '6 analyzer tests', 'git diff --check', 'exact changed-path set'],
              'not_run': ['FVM dependency resolution', 'translation generation', 'Dart formatting and analysis',
                          'Dart/Flutter tests', 'complete repository suite', 'APK builds', 'device measurements'],
              'cache_fix_applied': False,
          }
          Path('docs/performance_preparation.json').write_text(json.dumps(receipt, indent=2) + '\n')
          PY
          git rm -r .agents/handoffs/performance-diagnostics .github/workflows/prepare-performance-diagnostics.yml
          git add --all
          git diff --cached --check
          git commit -m 'feat(diagnostics): instrument frame stalls and cache operations'
          remote_head=$(git ls-remote origin "refs/heads/$branch" | cut -f1)
          test "$remote_head" = "$GITHUB_SHA"
          git push origin "HEAD:refs/heads/$branch"
