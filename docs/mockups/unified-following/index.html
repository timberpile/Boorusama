function load() {
  try {
    const value = JSON.parse(localStorage.getItem(STORAGE_KEY));
    if (value?.version===1 && Array.isArray(value.searches) && Array.isArray(value.folders) && Array.isArray(value.seen) &&
        value.searches.every(s=>typeof s.id==='string' && typeof s.query==='string' && typeof s.name==='string' && PROFILES[s.profile]) &&
        value.folders.every(f=>typeof f.id==='string' && typeof f.name==='string' && Array.isArray(f.searchIds))) return value;
  } catch (_) { /* Private browsing or invalid demo storage: use fresh fixtures. */ }
  return seed();
}

function folderPath(folder) {
  const names=[],visited=new Set();
  while(folder&&!visited.has(folder.id)){visited.add(folder.id);names.unshift(folder.name);folder=folderById(folder.parent);}
  return names.join(' / ');
}
function folderSearchIds(id, visited=new Set()) {
  if(visited.has(id))return[];visited.add(id);
  const folder=folderById(id);if(!folder)return[];
  return [...new Set([...folder.searchIds,...db.folders.filter(f=>f.parent===id).flatMap(f=>folderSearchIds(f.id,visited))])].filter(id=>byId(id));
}

const postKey = p => `${PROFILES[p.profile].host}:${p.id}`;
function fixturePosts(ids) {
  const result=new Map();
  for(const id of [...new Set(ids)]) {
    const source=byId(id);if(!source)continue;
    const number=/^s\d+$/.test(source.id)?Number(source.id.slice(1))-1:[...source.id].reduce((n,c)=>(n*31+c.charCodeAt(0))%100000,0)+100,revision=source.revision||0;
    for(let j=0;j<5;j++) {
      const postId=j===0&&!revision?101:1000+number*10+j+revision*10000000;
      const pi=Object.keys(PROFILES).indexOf(source.profile);
      const minutes=j===0&&!revision?8+pi*11:30+(number%9)*23+j*72;
      const post={id:postId,profile:source.profile,createdAt:REFERENCE_TIME-minutes*60000,sourceIds:[id],hue:j===0&&!revision?(pi*57+270)%360:(number*39+j*27+revision*45)%360,variant:j===0&&!revision?pi:(number+j)%4,isNew:j<2,
        title:j===0&&!revision?['Violet horizon','Paper gardens','Quiet orbit'][pi]:`${source.name} · ${['Study','Reflection','Composition','Field notes','Afterglow'][j]}`};
      const key=postKey(post),existing=result.get(key);
      if(existing)existing.sourceIds.push(id);else result.set(key,post);
    }
  }
  return [...result.values()].sort((a,b)=>b.createdAt-a.createdAt||postKey(a).localeCompare(postKey(b)));
}
function filteredSources(ids) {return ids.map(byId).filter(Boolean).filter(s=>(profileFilter==='all'||s.profile===profileFilter)&&`${s.name} ${s.query} ${PROFILES[s.profile].name}`.toLowerCase().includes(filterText.toLowerCase()));}

function formError(message){const el=document.getElementById('form-error');if(el)el.textContent=message;}
function newFeed(preselected=''){const available=db.folders.filter(f=>!f.feed);openDialog('Create feed',`<p>A feed is a live Posts view of a pinned-search folder. Your searches are linked, never copied.</p><form data-form="feed"><label class="field">Folder<select name="folder" id="feed-folder"><option value="new">Create a new folder</option>${available.map(f=>`<option value="${attr(f.id)}" ${f.id===preselected?'selected':''}>${escapeHtml(folderPath(f))}</option>`).join('')}</select></label><label class="field ${preselected?'hidden':''}" id="feed-name-field">New folder name<input name="name" placeholder="e.g. Weekend discoveries" maxlength="80" ${preselected?'':'required'}></label><div class="hint">${icon('link')} The feed uses this folder’s name and includes its subfolders. Rename or edit the folder and the feed updates too.</div>${footer('Create feed')}</form>`);}
function folderForm(parent='',rename=''){const f=folderById(rename);openDialog(f?'Rename folder':'New folder',`<form data-form="folder" data-id="${attr(rename)}" data-parent="${attr(parent)}"><label class="field">Folder name<input name="name" value="${attr(f?.name||'')}" placeholder="Folder name" maxlength="80" required></label><div class="hint">${f?.feed?'This also renames the feed in Following. No searches are copied or moved.':`Location: ${escapeHtml(parent?folderPath(folderById(parent)):'Pinned searches')}`}</div>${footer(f?'Save name':'Create folder')}</form>`);}
function searchForm(mode,id='') {
  const editing=mode==='edit',source=editing?byId(id):null,target=!editing?folderById(id):null,following=mode==='follow';
  if(editing&&!source)return;
  openDialog(editing?'Edit search':following?'Follow something new':'Pin a search',`<p>${editing?'This is the original pinned search, not a feed-specific copy.':following?'Follow an artist, a tag, or a full search. It becomes a pinned search in the feeds you choose.':'Keep a reusable search, with or without a feed.'}</p><form data-form="search" data-mode="${mode}" data-id="${attr(source?.id||'')}" data-folder="${attr(target?.id||'')}"><div class="row"><label class="field grow">Type<select name="kind"><option value="artist" ${(source?.kind||'artist')==='artist'?'selected':''}>Artist</option><option value="tag" ${source?.kind==='tag'?'selected':''}>Tag</option><option value="search" ${source?.kind==='search'?'selected':''}>Search</option></select></label><label class="field grow">Profile<select name="profile" ${editing?'disabled':''}>${Object.entries(PROFILES).map(([p,v])=>`<option value="${p}" ${(source?.profile||'d')===p?'selected':''}>${v.name}</option>`).join('')}</select></label></div><label class="field">Search query<textarea name="query" placeholder="e.g. mosslight rating:g" required maxlength="600">${escapeHtml(source?.query||'')}</textarea><small>Uses this profile’s tag syntax. A search belongs to one profile; a feed can mix profiles.</small></label><label class="field">Display name <span class="small muted">Optional</span><input name="name" value="${attr(source?.name||'')}" placeholder="e.g. Mosslight" maxlength="80"></label>${editing?`<div class="hint"><strong>Used in ${memberships(source.id).length} folders · ${affectedFeeds(source.id).length} feeds.</strong><br>${escapeHtml(memberships(source.id).map(folderPath).join(', ')||'Not in a folder')}. Query edits apply everywhere and refresh affected results. The profile stays unchanged.</div>`:following?`<div class="field">Follow in${feeds().map(f=>`<label class="check-row"><input type="checkbox" name="destinations" value="${attr(f.id)}" ${f.id===target?.id?'checked':''}><span>${escapeHtml(f.name)}<small>${escapeHtml(folderPath(f))}</small></span></label>`).join('')||'<span class="muted small">Create a feed first.</span>'}</div><div class="hint">An identical pinned search on the same profile will be reused. You can select several feeds.</div>`:`<div class="hint">Location: <strong>${escapeHtml(target?folderPath(target):'Pinned searches / Not in a folder')}</strong>. ${target?.feed?'This folder’s feed will include the search.':'Pinning alone does not create a feed.'}</div>`}${footer(editing?'Save changes':following?'Follow':'Pin search')}</form>`);
}
function existingForm(folderId){const f=folderById(folderId);if(!f)return;const included=folderSearchIds(folderId);openDialog('Add existing searches',`<p>Link pinned searches to ${escapeHtml(f.name)}. Their queries and update state stay shared.</p><form data-form="existing" data-id="${attr(folderId)}"><label class="field">Filter pinned searches<input type="search" id="picker-filter" placeholder="Name, query, or profile"></label><div id="picker-list">${db.searches.map(s=>`<label class="check-row picker-row" data-match="${attr((s.name+' '+s.query+' '+PROFILES[s.profile].name).toLowerCase())}"><input type="checkbox" name="searches" value="${attr(s.id)}" ${included.includes(s.id)?'checked disabled':''}><span class="grow">${escapeHtml(s.name)}<small>${PROFILES[s.profile].name} · ${escapeHtml(s.query)}${included.includes(s.id)?' · Already included':''}</small></span></label>`).join('')}</div>${db.searches.length?'':'<p class="hint">No pinned searches yet. Close this dialog and add a new search.</p>'}${footer('Add to folder')}</form>`);}
function placeForm(ids){if(!ids.length){toast('Select at least one search.');return;}openDialog('Add to folders',`<p>Link ${ids.length===1?escapeHtml(byId(ids[0]).name):ids.length+' selected searches'} to other folders. This does not make copies or remove existing links.</p><form data-form="place" data-ids="${attr(ids.join(','))}">${db.folders.map(f=>{const allIncluded=ids.every(id=>folderSearchIds(f.id).includes(id));return `<label class="check-row"><input type="checkbox" name="folders" value="${attr(f.id)}" ${allIncluded?'checked disabled':''}><span class="grow">${escapeHtml(folderPath(f))}<small>${f.feed?'Feed in Following':'Search folder'}${allIncluded?' · Already included':''}</small></span></label>`;}).join('')}${footer('Add to folders')}</form>`);}
function confirmation(title,text,action,id,label='Confirm'){openDialog(title,`<p>${text}</p><div class="dialog-actions">${button('Cancel','close-dialog','','btn')}${button(label,action,id,'btn tonal')}</div>`);}
function postDialog(key){const p=fixturePosts(db.searches.map(s=>s.id)).find(p=>postKey(p)===key);if(!p)return;openDialog(p.title,`${art(p).replace('class="art ','class="post-detail-art art ')}<span class="badge">${PROFILES[p.profile].name} · #${p.id}</span><dl class="detail-data"><dt>Uploaded</dt><dd>${new Date(p.createdAt).toISOString().replace('T',' ').replace('.000Z',' UTC')}</dd><dt>Matched by</dt><dd>${p.sourceIds.map(id=>escapeHtml(byId(id)?.name)).join(', ')}</dd><dt>Post identity</dt><dd>${escapeHtml(postKey(p))}</dd></dl><div class="hint">Illustrative content only. Identical numeric IDs on different sites are separate posts; overlapping matches on one site are shown once. Matching artwork on different sites is not automatically deduplicated.</div>`);}
function notes(){openDialog('Design notes',`<p><strong>Recommended: Pinned searches + Following.</strong> Keep the established name for search definitions. “Following” describes why users visit; “Create feed” describes what they make.</p><table class="naming-table"><thead><tr><th>Alternative</th><th>Trade-off</th></tr></thead><tbody><tr><td>Search library</td><td>Clear, broader than pinning; requires relearning an existing name.</td></tr><tr><td>Streams</td><td>Compact, but does not naturally explain following artists.</td></tr><tr><td>Watchlist</td><td>Suggests monitoring or alerts more than browsing posts.</td></tr></tbody></table><div class="hint"><strong>The model</strong><br>Search → one profile + query.<br>Folder → references to searches and subfolders.<br>Feed → the folder’s Posts view, available in Following.<br>One search can be linked to multiple folders.</div><div class="hint"><strong>Try the shared edit</strong><br>Open Daily inspiration → Searches → Mosslight → Edit search. Change its name or query. Color & form and Pinned searches use the very same record.</div><div class="hint"><strong>Prototype scope</strong><br>Offline fixtures, simulated refresh, local-only persistence. No API, account actions, real artwork, Flutter integration, or cross-site image matching. New queries receive synthetic results, not real search results. Colors approximate an adaptive dark/light app theme; use existing Kurumi components in Flutter.</div><div class="dialog-actions">${button('Reset demo','reset-prompt','','btn danger')}${button('Close','close-dialog','','btn primary')}</div>`);}
function updateSelection(id,range=false){const visible=[...document.querySelectorAll('[data-row]')].map(el=>el.dataset.row);selectionMode=true;if(range&&anchorId&&visible.includes(anchorId)){const a=visible.indexOf(anchorId),b=visible.indexOf(id);visible.slice(Math.min(a,b),Math.max(a,b)+1).forEach(id=>selected.add(id));}else{selected.has(id)?selected.delete(id):selected.add(id);anchorId=id;}render();}
function applyChanges(message){persist();closeDialog();selected.clear();selectionMode=false;render();toast(message);}
document.addEventListener('click',event=>{
  if(event.target.closest('.skip-link')){event.preventDefault();document.getElementById('main').focus();return;}
  const el=event.target.closest('[data-action]');if(!el)return;
  const {action,id=''}=el.dataset;
  if(action==='open-search'&&Date.now()<suppressClickUntil){event.preventDefault();return;}
  const f=folderById(id),s=byId(id);
  if(['nav','open-feed','open-folder','manage','folder-posts','tab','library-tab'].includes(action)&&dialog.open)closeDialog();
  switch(action){
    case 'nav':navigate(id);break;
    case 'open-feed':navigate(`folder/${id}/posts/following`);break;
    case 'open-folder':navigate(`folder/${id}/searches/${route.origin||'library'}`);break;
    case 'manage':navigate(`folder/${id}/searches/${route.page==='following'?'following':route.origin}`);break;
    case 'folder-posts':navigate(`folder/${id}/posts/${f?.feed?'following':'library'}`);break;
    case 'tab':selected.clear();selectionMode=false;profileFilter='all';filterText='';navigate(`folder/${route.id}/${id}/${route.origin}`,true);break;
    case 'library-tab':libraryView=id;selected.clear();selectionMode=false;filterText='';render();break;
    case 'profile':profileFilter=id;selected.clear();selectionMode=false;render();break;
    case 'drawer':document.body.classList.add('drawer-open');document.querySelector('.sidebar .nav-item')?.focus();break;
    case 'drawer-close':document.body.classList.remove('drawer-open');break;
    case 'device':{const phone=document.getElementById('workspace').classList.toggle('phone');document.body.classList.toggle('preview-phone',phone);el.textContent=phone?'Desktop preview':'Phone preview';el.setAttribute('aria-pressed',phone);break;}
    case 'theme':{const light=document.documentElement.dataset.theme!=='light';document.documentElement.dataset.theme=light?'light':'dark';el.textContent=light?'Dark mode':'Light mode';break;}
    case 'notes':notes();break;
    case 'close-dialog':closeDialog();break;
    case 'create-feed':newFeed();break;
    case 'enable-feed':newFeed(id);break;
    case 'new-folder':folderForm(id);break;
    case 'rename-folder':folderForm('',id);break;
    case 'folder-menu':folderMenu(id,el);break;
    case 'search-menu':searchMenu(id,el);break;
    case 'follow':if(feeds().length)searchForm('follow',id);else{newFeed();toast('Create a feed to choose where new posts appear.');}break;
    case 'new-search':searchForm('new',id);break;
    case 'edit-search':searchForm('edit',id);break;
    case 'add-existing':existingForm(id);break;
    case 'place-search':placeForm([id]);break;
    case 'open-search':if(selectionMode||event.shiftKey||event.ctrlKey||event.metaKey)updateSelection(id,event.shiftKey);else navigate(`search/${id}`);break;
    case 'select':closeDialog();updateSelection(id);break;
    case 'selection-exit':selected.clear();selectionMode=false;render();break;
    case 'select-all':document.querySelectorAll('[data-row]').forEach(e=>selected.add(e.dataset.row));render();break;
    case 'bulk-add':placeForm([...selected]);break;
    case 'bulk-remove':if(!selected.size){toast('Select at least one search.');break;}confirmation(currentFolder()?'Remove selected links?':'Delete selected searches?',currentFolder()?'The searches stay pinned and remain in every other folder.':'These searches will be removed from every folder and feed.','confirm-bulk-remove',[...selected].join(','),currentFolder()?'Remove links':'Delete everywhere');break;
    case 'confirm-bulk-remove':{const ids=id.split(','),folder=currentFolder();if(folder)folder.searchIds=folder.searchIds.filter(id=>!ids.includes(id));else{db.searches=db.searches.filter(s=>!ids.includes(s.id));db.folders.forEach(f=>f.searchIds=f.searchIds.filter(id=>!ids.includes(id)));}applyChanges(folder?'Folder links removed. Searches remain pinned.':'Selected searches deleted everywhere.');break;}
    case 'remove-feed':confirmation('Remove feed from Following?',`<strong>${escapeHtml(f?.name)}</strong> and all its searches will remain in Pinned searches. Only the feed entry is removed.`,'confirm-remove-feed',id,'Remove feed');break;
    case 'confirm-remove-feed':if(f){f.feed=false;applyChanges('Feed removed. Folder and searches kept.');navigate('following');}break;
    case 'remove-search':confirmation('Remove from this folder?',`<strong>${escapeHtml(s?.name)}</strong> stays pinned and remains available in other folders and feeds.`,'confirm-remove-search',id,'Remove link');break;
    case 'confirm-remove-search':{const folder=currentFolder();if(folder){folder.searchIds=folder.searchIds.filter(sid=>sid!==id);applyChanges('Removed from folder. Original search kept.');}break;}
    case 'delete-search':confirmation('Delete search everywhere?',`<strong>${escapeHtml(s?.name)}</strong> will be removed from ${memberships(id).length} folders and ${affectedFeeds(id).length} feeds. This deletes the original pinned search, not just a folder link.`,'confirm-delete-search',id,'Delete everywhere');break;
    case 'confirm-delete-search':db.searches=db.searches.filter(s=>s.id!==id);db.folders.forEach(f=>f.searchIds=f.searchIds.filter(sid=>sid!==id));applyChanges('Search deleted everywhere.');break;
    case 'mark-seen':{const keys=postsFor(folderSearchIds(id)).map(postKey);db.seen=[...new Set([...db.seen,...keys])];persist();render();toast('Posts in this filtered view marked as seen.');break;}
    case 'post':postDialog(id);break;
    case 'retry':scenario='normal';document.getElementById('scenario').value='normal';render();toast('Simulated refresh complete. All profiles available.');break;
    case 'reset-prompt':confirmation('Reset this demo?','This clears only the prototype’s local edits. It does not touch Boorusama data.','reset','','Reset demo');break;
    case 'reset':db=seed();profileFilter='all';filterText='';scenario='normal';libraryView='folders';document.getElementById('scenario').value='normal';applyChanges('Demo reset.');navigate('following');break;
  }
});
document.addEventListener('input',e=>{
  if(e.target.id==='search-filter'){const cursor=e.target.selectionStart;filterText=e.target.value;render();const input=document.getElementById('search-filter');input?.focus();input?.setSelectionRange(cursor,cursor);}
  if(e.target.id==='picker-filter'){const value=e.target.value.toLowerCase();document.querySelectorAll('.picker-row').forEach(row=>row.classList.toggle('hidden',!row.dataset.match.includes(value)));}
});
document.addEventListener('change',e=>{
  if(e.target.id==='scenario'){scenario=e.target.value;render();}
  if(e.target.id==='post-sort'){sortOrder=e.target.value;render();}
  if(e.target.id==='feed-folder'){const isNew=e.target.value==='new';document.getElementById('feed-name-field').classList.toggle('hidden',!isNew);dialog.querySelector('[name="name"]').required=isNew;}
});
document.addEventListener('submit',e=>{
  const form=e.target;if(!form.dataset.form)return;e.preventDefault();const values=new FormData(form),type=form.dataset.form;
  if(type==='feed'){
    const id=values.get('folder');let folder=folderById(id);
    if(id==='new'){const name=String(values.get('name')).trim();if(!name)return formError('Enter a folder name.');if(db.folders.some(f=>!f.parent&&f.name.toLowerCase()===name.toLowerCase()))return formError('A folder with this name already exists. Choose it above.');folder={id:uniqueId('f'),name,parent:null,searchIds:[],feed:true};db.folders.push(folder);}
    if(!folder)return formError('Choose an available folder.');folder.feed=true;applyChanges('Feed created from the same folder.');navigate(`folder/${folder.id}/posts/following`);
  } else if(type==='folder'){
    const name=String(values.get('name')).trim(),id=form.dataset.id,parent=form.dataset.parent||null,existing=folderById(id),actualParent=existing?existing.parent:parent;
    if(!name)return formError('Enter a folder name.');if(db.folders.some(f=>f.id!==id&&f.parent===actualParent&&f.name.toLowerCase()===name.toLowerCase()))return formError('A folder with this name already exists here.');
    if(existing)existing.name=name;else db.folders.push({id:uniqueId('f'),name,parent,searchIds:[],feed:false});applyChanges(existing?'Folder and feed name updated.':'Folder created.');
  } else if(type==='search'){
    const mode=form.dataset.mode,existing=byId(form.dataset.id),profile=existing?.profile||values.get('profile'),query=canonicalQuery(String(values.get('query'))),name=String(values.get('name')).trim()||query,kind=values.get('kind'),destinations=values.getAll('destinations');
    if(!query)return formError('Enter an artist tag, tag, or query.');if(mode==='follow'&&!destinations.length)return formError('Choose at least one feed.');
    const duplicate=db.searches.find(s=>s.id!==existing?.id&&s.profile===profile&&canonicalQuery(s.query)===query);
    if(existing&&duplicate)return formError('This query is already pinned on this profile. Add that search to the folder instead.');
    let source=existing||duplicate,reused=!!duplicate;
    if(existing){if(existing.query!==query)existing.revision=(existing.revision||0)+1;Object.assign(existing,{name,query,kind});}
    else if(!source){source={id:uniqueId('s'),name,query,profile,kind,revision:1};db.searches.push(source);}
    const target=folderById(form.dataset.folder);for(const folder of mode==='follow'?destinations.map(folderById).filter(Boolean):target?[target]:[]){if(!folderSearchIds(folder.id).includes(source.id))folder.searchIds.push(source.id);}
    applyChanges(existing?'Shared search updated in every folder and feed.':reused?'Existing pinned search reused. No duplicate created.':mode==='follow'?'Following. The search is also in Pinned searches.':'Search pinned.');
  } else if(type==='existing'){
    const ids=values.getAll('searches'),folder=folderById(form.dataset.id);if(!ids.length)return formError('Select at least one search that is not already included.');if(folder)folder.searchIds=[...new Set([...folder.searchIds,...ids])];applyChanges('Existing searches linked. No copies created.');
  } else if(type==='place'){
    const destinations=values.getAll('folders'),ids=form.dataset.ids.split(',');if(!destinations.length)return formError('Choose a folder that does not already include these searches.');destinations.map(folderById).filter(Boolean).forEach(f=>f.searchIds=[...new Set([...f.searchIds,...ids.filter(id=>!folderSearchIds(f.id).includes(id))])]);applyChanges('Shared searches linked to the selected folders.');
  }
});
/* Long-press is additive; ordinary vertical movement cancels before selection starts. */
document.addEventListener('pointerdown',e=>{
  const card=e.target.closest('.search-open');if(!card||e.button!==0)return;
  const id=card.dataset.id;press={id,x:e.clientX,y:e.clientY,active:false,order:[...document.querySelectorAll('[data-row]')].map(el=>el.dataset.row),initial:new Set(selected)};
  press.timer=setTimeout(()=>{if(!press)return;press.active=true;selectionMode=true;selected.add(id);anchorId=id;suppressClickUntil=Date.now()+700;render();},450);
});
document.addEventListener('pointermove',e=>{
  if(!press)return;if(!press.active){if(Math.hypot(e.clientX-press.x,e.clientY-press.y)>10){clearTimeout(press.timer);press=null;}return;}
  const hit=document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-row]');if(!hit)return;
  const a=press.order.indexOf(press.id),b=press.order.indexOf(hit.dataset.row);if(a<0||b<0)return;
  selected=new Set([...press.initial,...press.order.slice(Math.min(a,b),Math.max(a,b)+1)]);render();
});
document.addEventListener('touchmove',e=>{if(press?.active)e.preventDefault();},{passive:false});
function endPress(){if(press){clearTimeout(press.timer);if(press.active)suppressClickUntil=Date.now()+600;press=null;}}
document.addEventListener('pointerup',endPress);document.addEventListener('pointercancel',endPress);
document.addEventListener('contextmenu',e=>{const card=e.target.closest('.search-open');if(card){e.preventDefault();if(!selectionMode)searchMenu(card.dataset.id,card);}});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&!dialog.open){if(document.body.classList.contains('drawer-open'))document.body.classList.remove('drawer-open');else if(selectionMode){selected.clear();selectionMode=false;render();}}
  if(e.target.matches('[role="tab"]')&&['ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();const tabs=[...e.target.parentElement.querySelectorAll('[role="tab"]')],index=tabs.indexOf(e.target),next=tabs[(index+(e.key==='ArrowRight'?1:-1)+tabs.length)%tabs.length],id=next.dataset.id;next.click();document.querySelector(`[role="tab"][data-id="${id}"]`)?.focus();}
});
new ResizeObserver(entries=>{document.documentElement.style.setProperty('--prototype-height',entries[0].target.offsetHeight+'px');}).observe(document.querySelector('.prototype-bar'));
render();
</script>
