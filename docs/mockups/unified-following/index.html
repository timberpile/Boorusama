function footer(submit){return `<p class="form-error" id="form-error" role="alert"></p><div class="dialog-actions">${btn('Cancel','close-dialog','','btn')}<button class="btn primary" type="submit">${esc(submit)}</button></div>`;}
function error(message){const e=document.getElementById('form-error');if(e)e.textContent=message;}
function followForm(target='',editing=''){const s=byId(editing),isEdit=!!s,f=folderById(target);openDialog(isEdit?'Edit Topic':'Follow topic',`<p>${isEdit?'Edit the original topic. Its changes apply in every folder containing it.':'Follow an artist, tag or search. Each topic uses one profile and can appear in several folders.'}</p><form data-form="topic" data-edit="${esc(editing)}"><div class="row"><label class="field grow">Topic type<select name="kind"><option value="artist" ${(s?.kind||'artist')==='artist'?'selected':''}>Artist</option><option value="tag" ${s?.kind==='tag'?'selected':''}>Tag</option><option value="search" ${s?.kind==='search'?'selected':''}>Search</option></select></label><label class="field grow">Profile<select name="profile" ${isEdit?'disabled':''}>${Object.entries(PROFILES).map(([id,p])=>`<option value="${id}" ${(s?.profile||'d')===id?'selected':''}>${p.name}</option>`).join('')}</select></label></div><label class="field">Query<textarea name="query" maxlength="600" placeholder="e.g. mosslight rating:g" required>${esc(s?.query||'')}</textarea><small>Uses the selected profile’s query syntax.</small></label><label class="field">Topic name <span class="small muted">Optional</span><input name="name" value="${esc(s?.name||'')}" placeholder="e.g. Mosslight" maxlength="80"></label>${isEdit?`<div class="hint"><strong>Shared topic.</strong> Used in ${memberships(s.id).length} folder(s)${db.rootIds.includes(s.id)?' and Following root':''}. Changes update every reference.</div>`:`<label class="field">Add to<select name="destination"><option value="root" ${!f?'selected':''}>Following · root</option>${db.folders.map(item=>`<option value="${esc(item.id)}" ${f?.id===item.id?'selected':''}>${esc(folderPath(item))}</option>`).join('')}</select></label><div class="hint">If this query is already followed on the same profile, the existing topic will be reused instead of duplicated.</div>`}${footer(isEdit?'Save Topic':'Follow topic')}</form>`);}
function folderForm(parent='',rename=''){const existing=folderById(rename);openDialog(existing?'Rename folder':'New folder',`<form data-form="folder" data-id="${esc(rename)}" data-parent="${esc(parent)}"><label class="field">Folder name<input name="name" value="${esc(existing?.name||'')}" placeholder="e.g. Favorite artists" maxlength="80" required></label><div class="hint">${existing?'The folder’s feed uses the same name.':'Every folder automatically has an Open Feed action. No separate feed needs to be created.'}</div>${footer(existing?'Save name':'Create folder')}</form>`);}
function existingForm(folderId){const f=folderById(folderId);if(!f)return;const included=folderTopicIds(f.id);openDialog('Add existing topics',`<p>Reuse topics you already follow in ${esc(f.name)}. This links records rather than copying search queries.</p><form data-form="existing" data-id="${esc(folderId)}"><label class="field">Filter topics<input type="search" id="picker-filter" placeholder="Name, query, or profile"></label><div id="picker-list">${db.topics.map(s=>`<label class="check-row picker-row" data-match="${esc((s.name+' '+s.query+' '+PROFILES[s.profile].name).toLowerCase())}"><input type="checkbox" name="topics" value="${esc(s.id)}" ${included.includes(s.id)?'checked disabled':''}><span class="grow">${esc(s.name)}<small>${PROFILES[s.profile].name} · ${esc(s.query)}${included.includes(s.id)?' · Already included':''}</small></span></label>`).join('')}</div>${footer('Add to folder')}</form>`);}
function placeForm(ids){if(!ids.length){toast('Select a topic first.');return;}openDialog('Add to folders',`<p>Share ${ids.length===1?esc(byId(ids[0])?.name):ids.length+' topics'} with other folders. This does not make duplicate searches.</p><form data-form="place" data-ids="${esc(ids.join(','))}">${db.folders.map(f=>{const included=ids.every(id=>folderTopicIds(f.id).includes(id));return `<label class="check-row"><input type="checkbox" name="folders" value="${esc(f.id)}" ${included?'checked disabled':''}><span class="grow">${esc(folderPath(f))}${included?'<small>Already included</small>':''}</span></label>`;}).join('')}${footer('Add to folders')}</form>`);}
function confirmation(title,message,action,id,label='Confirm'){openDialog(title,`<p>${message}</p><div class="dialog-actions">${btn('Cancel','close-dialog','','btn')}${btn(label,action,id,'btn tonal')}</div>`);}
function postDialog(key){let p=fixturePosts(db.topics.map(s=>s.id)).find(p=>postKey(p)===key);if(!p)for(const s of db.topics){p=searchPosts(s).find(p=>postKey(p)===key);if(p)break;}if(!p)return;openDialog(p.title,`${art(p).replace('class="art ','class="post-detail-art art ')}<span class="badge">${PROFILES[p.profile].name} · #${p.id}</span><dl class="detail-data"><dt>Uploaded</dt><dd>${new Date(p.createdAt).toISOString().replace('T',' ').replace('.000Z',' UTC')}</dd><dt>Matched by</dt><dd>${p.sourceIds.map(id=>esc(byId(id)?.name)).join(', ')}</dd><dt>Post identity</dt><dd>${esc(postKey(p))}</dd></dl><div class="hint">Illustrative posts only. The same numeric ID on different sites identifies different posts; matches from multiple topics on one site are merged in a feed.</div>`);}
function notes(){openDialog('Concept notes',`<p><strong>Following replaces both Pinned searches and Following Feeds.</strong> It contains Topics and arbitrarily nested folders. Topics are reusable searches. Folders are the organizational units and can be opened as a combined feed.</p><div class="hint"><strong>Topic → normal search</strong><br>Opening a topic shows its standard searchable post results. “Load more posts” adds illustrative pages; this concept does not change the production search pipeline.</div><div class="hint"><strong>Folder → topics / Open Feed → combined results</strong><br>From a folder, use the top app bar’s Open Feed action. All descendant topics contribute. The feed has no independent definition or separate management view.</div><div class="hint"><strong>Pagination intentionally unresolved</strong><br>The combined feed shows only a synthetic cached slice. Infinite feed scrolling, historical pagination, memory limits, request batching, and cross-site merging remain separate engineering work.</div><div class="hint"><strong>Technical changes still needed</strong><br>Each search retains a profile. Production feed history must use per-topic adapters and a site-aware post key. Merge failures should be isolated by source. Edit/remove should not delete a topic referenced by another folder.</div><div class="hint"><strong>Prototype only</strong><br>No API calls, real images, Flutter changes, or real notifications. All content is synthetic and stored only in this browser.</div><div class="dialog-actions">${btn('Reset demo','reset-prompt','','btn danger')}${btn('Close','close-dialog','','btn primary')}</div>`);}
function selectTopic(id,range=false){const ids=[...document.querySelectorAll('[data-row]')].map(e=>e.dataset.row);selectionMode=true;if(range&&anchorId&&ids.includes(anchorId)){const a=ids.indexOf(anchorId),b=ids.indexOf(id);ids.slice(Math.min(a,b),Math.max(a,b)+1).forEach(t=>selected.add(t));}else{selected.has(id)?selected.delete(id):selected.add(id);anchorId=id;}render();}
function applyChanges(message){persist();closeDialog();selected.clear();selectionMode=false;render();toast(message);}
document.addEventListener('click',event=>{const el=event.target.closest('[data-action]');if(!el)return;const {action,id=''}=el.dataset,f=folderById(id),s=byId(id);
 if(action==='open-topic'&&Date.now()<suppressClickUntil){event.preventDefault();return;}
 if(['nav','open-folder','open-feed','open-topic'].includes(action)&&dialog.open)closeDialog();
 switch(action){
  case 'nav':navigate('following');break;
  case 'open-folder':navigate('folder/'+id);break;
  case 'open-feed':navigate('feed/'+id);break;
  case 'open-topic':if(selectionMode||event.shiftKey||event.ctrlKey||event.metaKey)selectTopic(id,event.shiftKey);else navigate(`topic/${id}/${route.page==='folder'?route.id:route.page==='topic'?route.origin:''}`);break;
  case 'drawer':document.body.classList.add('drawer-open');document.querySelector('.sidebar .nav-item')?.focus();break;
  case 'drawer-close':document.body.classList.remove('drawer-open');break;
  case 'device':{const phone=document.getElementById('workspace').classList.toggle('phone');document.body.classList.toggle('preview-phone',phone);el.textContent=phone?'Desktop preview':'Phone preview';el.setAttribute('aria-pressed',phone);break;}
  case 'theme':{const light=document.documentElement.dataset.theme!=='light';document.documentElement.dataset.theme=light?'light':'dark';el.textContent=light?'Dark mode':'Light mode';break;}
  case 'notes':notes();break;
  case 'close-dialog':closeDialog();break;
  case 'profile':profileFilter=id;selected.clear();selectionMode=false;render();break;
  case 'new-folder':if(dialog.open)closeDialog();folderForm(id);break;
  case 'rename-folder':folderForm('',id);break;
  case 'folder-menu':folderMenu(id,el);break;
  case 'topic-menu':topicMenu(id,el);break;
  case 'follow-topic':followForm(id);break;
  case 'edit-topic':followForm('',id);break;
  case 'add-existing':existingForm(id);break;
  case 'place-topic':placeForm([id]);break;
  case 'select':closeDialog();selectTopic(id);break;
  case 'selection-exit':selected.clear();selectionMode=false;render();break;
  case 'select-all':document.querySelectorAll('[data-row]').forEach(e=>selected.add(e.dataset.row));render();break;
  case 'bulk-add':placeForm([...selected]);break;
  case 'bulk-remove':if(!selected.size){toast('Select at least one topic.');break;}confirmation(route.page==='folder'?'Remove selected folder links?':'Unfollow selected topics?',route.page==='folder'?'The topics will remain in Following and in other folders. If a topic has no other folder, it moves to the Following root.':'These topics will be removed from all folders and Following.','confirm-bulk-remove',[...selected].join(','),route.page==='folder'?'Remove links':'Unfollow everywhere');break;
  case 'confirm-bulk-remove':{const ids=id.split(','),folder=route.page==='folder'?folderById(route.id):null;if(folder){folder.topicIds=folder.topicIds.filter(i=>!ids.includes(i));ids.forEach(i=>{if(!memberships(i).length&&!db.rootIds.includes(i))db.rootIds.push(i);});}else{db.topics=db.topics.filter(s=>!ids.includes(s.id));db.rootIds=db.rootIds.filter(i=>!ids.includes(i));db.folders.forEach(x=>x.topicIds=x.topicIds.filter(i=>!ids.includes(i)));}applyChanges(folder?'Removed folder links. Topics remain followed.':'Topics unfollowed everywhere.');break;}
  case 'remove-topic':confirmation('Remove from this folder?',`<strong>${esc(s?.name)}</strong> stays followed. If it has no other folders it will appear at the Following root.`,'confirm-remove-topic',id,'Remove link');break;
  case 'confirm-remove-topic':{const folder=folderById(route.id);if(folder){folder.topicIds=folder.topicIds.filter(i=>i!==id);if(!memberships(id).length&&!db.rootIds.includes(id))db.rootIds.push(id);applyChanges('Topic removed from folder, still followed.');}break;}
  case 'unfollow':confirmation('Unfollow everywhere?',`<strong>${esc(s?.name)}</strong> will disappear from Following and all ${memberships(id).length} folder(s). Other topics remain untouched.`,'confirm-unfollow',id,'Unfollow');break;
  case 'confirm-unfollow':db.topics=db.topics.filter(t=>t.id!==id);db.rootIds=db.rootIds.filter(i=>i!==id);db.folders.forEach(x=>x.topicIds=x.topicIds.filter(i=>i!==id));applyChanges('Topic unfollowed everywhere.');if(route.page==='topic')navigate('following');break;
  case 'delete-folder':confirmation('Delete empty folder?',`<strong>${esc(f?.name)}</strong> is empty. No topics will be deleted.`,'confirm-delete-folder',id,'Delete folder');break;
  case 'confirm-delete-folder':if(f&&!f.topicIds.length&&!db.folders.some(x=>x.parent===id)){db.folders=db.folders.filter(x=>x.id!==id);applyChanges('Empty folder deleted.');if(route.id===id)navigate('following');}break;
  case 'post':postDialog(id);break;
  case 'load-more':topicPages.set(id,(topicPages.get(id)||1)+1);render();toast('More search results loaded (simulated).');break;
  case 'feed-info':notes();break;
  case 'mark-seen':db.seen=[...new Set([...db.seen,...feedPosts(folderTopicIds(id)).map(postKey)])];persist();render();toast('Visible feed posts marked as seen.');break;
  case 'retry':scenario='normal';document.getElementById('scenario').value='normal';render();toast('Simulated refresh complete.');break;
  case 'reset-prompt':confirmation('Reset prototype?','This only resets the prototype fixtures in browser storage; no real Boorusama data is touched.','reset','','Reset demo');break;
  case 'reset':db=seed();topicPages.clear();profileFilter='all';filterText='';scenario='normal';document.getElementById('scenario').value='normal';applyChanges('Demo reset.');navigate('following');break;
 }
});
document.addEventListener('input',e=>{if(e.target.id==='topic-filter'){const i=e.target.selectionStart;filterText=e.target.value;render();const input=document.getElementById('topic-filter');input?.focus();input?.setSelectionRange(i,i);}if(e.target.id==='picker-filter'){const v=e.target.value.toLowerCase();document.querySelectorAll('.picker-row').forEach(row=>row.classList.toggle('hidden',!row.dataset.match.includes(v)));}});
document.addEventListener('change',e=>{if(e.target.id==='scenario'){scenario=e.target.value;render();}if(e.target.id==='post-sort'){feedSort=e.target.value;render();}});
document.addEventListener('submit',e=>{const form=e.target;if(!form.dataset.form)return;e.preventDefault();const v=new FormData(form);const type=form.dataset.form;
 if(type==='folder'){const name=String(v.get('name')).trim(),existing=folderById(form.dataset.id),parent=existing?existing.parent:(form.dataset.parent||null);if(!name)return error('Enter a name.');if(db.folders.some(f=>f.id!==existing?.id&&f.parent===parent&&f.name.toLowerCase()===name.toLowerCase()))return error('A folder with this name already exists here.');if(existing)existing.name=name;else db.folders.push({id:uniqueId('f'),name,parent,topicIds:[]});applyChanges(existing?'Folder renamed. Its feed has the same name.':'Folder created with Open Feed available.');}
 else if(type==='topic'){const existing=byId(form.dataset.edit),profile=existing?.profile||v.get('profile'),query=canonicalQuery(String(v.get('query'))),name=String(v.get('name')).trim()||query,kind=v.get('kind'),dest=v.get('destination');if(!query)return error('Enter a query.');const duplicate=db.topics.find(s=>s.id!==existing?.id&&s.profile===profile&&canonicalQuery(s.query)===query);if(existing&&duplicate)return error('This query is already followed on this profile. Link that topic instead.');let target=existing||duplicate;if(existing){if(existing.query!==query)existing.revision=(existing.revision||0)+1;Object.assign(existing,{name,query,kind});topicPages.delete(existing.id);}else if(!target){target={id:uniqueId('s'),name,query,profile,kind,revision:1};db.topics.push(target);}if(!existing){if(dest==='root'){if(!db.rootIds.includes(target.id))db.rootIds.push(target.id);}else{const f=folderById(dest);if(!f)return error('Choose a valid folder.');if(!folderTopicIds(f.id).includes(target.id))f.topicIds.push(target.id);}}applyChanges(existing?'Topic updated everywhere.':duplicate?'Existing topic reused; no duplicate created.':'Topic followed.');}
 else if(type==='existing'){const ids=v.getAll('topics'),f=folderById(form.dataset.id);if(!ids.length)return error('Select at least one topic to link.');if(f)f.topicIds=[...new Set([...f.topicIds,...ids])];applyChanges('Existing topics linked to folder.');}
 else if(type==='place'){const ids=form.dataset.ids.split(','),dests=v.getAll('folders');if(!dests.length)return error('Choose a folder.');dests.map(folderById).filter(Boolean).forEach(f=>f.topicIds=[...new Set([...f.topicIds,...ids.filter(id=>!folderTopicIds(f.id).includes(id))])]);applyChanges('Topics linked without copies.');}
});
document.addEventListener('pointerdown',e=>{const target=e.target.closest('.search-open');if(!target||e.button!==0)return;const id=target.dataset.id;press={id,x:e.clientX,y:e.clientY,active:false,order:[...document.querySelectorAll('[data-row]')].map(el=>el.dataset.row),initial:new Set(selected)};press.timer=setTimeout(()=>{if(!press)return;press.active=true;selectionMode=true;selected.add(id);anchorId=id;suppressClickUntil=Date.now()+700;render();},450);});
document.addEventListener('pointermove',e=>{if(!press)return;if(!press.active){if(Math.hypot(e.clientX-press.x,e.clientY-press.y)>10){clearTimeout(press.timer);press=null;}return;}const el=document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-row]');if(!el)return;const a=press.order.indexOf(press.id),b=press.order.indexOf(el.dataset.row);if(a<0||b<0)return;selected=new Set([...press.initial,...press.order.slice(Math.min(a,b),Math.max(a,b)+1)]);render();});
document.addEventListener('touchmove',e=>{if(press?.active)e.preventDefault();},{passive:false});
function endPress(){if(press){clearTimeout(press.timer);if(press.active)suppressClickUntil=Date.now()+600;press=null;}}
document.addEventListener('pointerup',endPress);document.addEventListener('pointercancel',endPress);
document.addEventListener('contextmenu',e=>{const target=e.target.closest('.search-open');if(target){e.preventDefault();if(!selectionMode)topicMenu(target.dataset.id,target);}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!dialog.open){if(document.body.classList.contains('drawer-open'))document.body.classList.remove('drawer-open');else if(selectionMode){selected.clear();selectionMode=false;render();}}});
new ResizeObserver(e=>document.documentElement.style.setProperty('--prototype-height',e[0].target.offsetHeight+'px')).observe(document.querySelector('.prototype-bar'));
render();
</script>
</body>
</html>
