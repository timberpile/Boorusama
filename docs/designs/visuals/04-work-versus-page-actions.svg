<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="900" viewBox="0 0 1480 900" role="img" aria-labelledby="ttl dsc"><title id="ttl">One viewer, two action targets</title><desc id="dsc">Work and current Page are different resources. The action scope must be clear.</desc><defs><linearGradient id="bg" x2="0%" y2="100%"><stop offset="0%" stop-color="#FDFEFF"/><stop offset="100%" stop-color="#F3F7FF"/></linearGradient><marker id="head" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#16203D"/></marker></defs><rect width="1480" height="900" fill="url(#bg)"/><rect x="44" y="30" width="8" height="78" rx="4" fill="#3E82C9"/><text x="68" y="74" font-family="Arial,Helvetica,sans-serif" font-size="37" font-weight="700" fill="#16203D" text-anchor="start">One viewer, two action targets</text><text x="68" y="107" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#53617D" text-anchor="start">Work and current Page are different resources. The action scope must be clear.</text><rect x="1201" y="49" width="232" height="36" rx="16" fill="#EFE5FF" stroke="#815AC0" stroke-width="1.3"/><text x="1317" y="73" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#16203D" text-anchor="middle">WORK / PAGE</text><path d="M44 129H1435" stroke="#C8D3E7" stroke-width="1.5"/><rect x="55" y="170" width="400" height="640" rx="42" fill="#171C29" stroke="#36425B" stroke-width="6"/><rect x="69" y="190" width="372" height="600" rx="28" fill="#F8FAFF" stroke="#E4E9F2" stroke-width="0"/><rect x="85" y="207" width="340" height="335" rx="14" fill="#101828" stroke="#101828" stroke-width="1"/><circle cx="244" cy="360" r="100" fill="#526B95" opacity=".30"/><circle cx="287" cy="326" r="38" fill="#FFD9C0"/><path d="M143 511Q175 387 262 384Q355 388 392 511Z" fill="#7DB0E0"/><path d="M245 288Q313 270 320 331Q311 364 288 367L268 339Q214 354 207 339Z" fill="#A18FCB"/><rect x="330" y="223" width="80" height="36" rx="16" fill="#263047" stroke="#63718F" stroke-width="1.3"/><text x="370" y="247" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#16203D" text-anchor="middle">2 / 5</text><text x="102" y="570" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#16203D" text-anchor="start">Summer Sky</text><text x="102" y="600" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#53617D" text-anchor="start">by Aoi · 5 pages</text><rect x="95" y="624" width="320" height="58" rx="14" fill="#EFE5FF" stroke="#815AC0" stroke-width="1.6"/><text x="255" y="659" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#16203D" text-anchor="middle">Work title + primary actions</text><rect x="95" y="701" width="320" height="58" rx="14" fill="#E0EEFF" stroke="#3E82C9" stroke-width="1.6"/><text x="255" y="736" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#16203D" text-anchor="middle">Page 2 overflow actions</text><rect x="522" y="178" width="422" height="260" rx="20" fill="#EFE5FF" stroke="#815AC0" stroke-width="1.6"/><rect x="539" y="194" width="52" height="49" rx="14" fill="#FFFFFF" stroke="#815AC0" stroke-width="1"/><g transform="translate(550 203)" fill="none" stroke="#815AC0" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><path d="M1 10L16 2L31 10L16 18Z M1 18L16 26L31 18 M1 25L16 33L31 25"/></g><text x="606" y="229" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#16203D" text-anchor="start">Whole Work actions</text><text x="552" y="278" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16203D" text-anchor="start">Pixiv bookmark (planned)</text><text x="552" y="317" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16203D" text-anchor="start">Save Work locally (planned)</text><text x="552" y="356" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16203D" text-anchor="start">Share Work link (planned)</text><text x="552" y="395" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16203D" text-anchor="start">Download all pages (candidate)</text><rect x="987" y="178" width="435" height="260" rx="20" fill="#E0EEFF" stroke="#3E82C9" stroke-width="1.6"/><rect x="1004" y="194" width="52" height="49" rx="14" fill="#FFFFFF" stroke="#3E82C9" stroke-width="1"/><g transform="translate(1015 203)" fill="none" stroke="#3E82C9" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><rect x="0" y="1" width="29" height="26" rx="4"/><circle cx="9" cy="9" r="2.5"/><path d="M3 23L11 15L16 19L21 12L27 24"/></g><text x="1071" y="229" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#16203D" text-anchor="start">Selected Page actions</text><text x="1017" y="278" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16203D" text-anchor="start">Save current page locally</text><text x="1017" y="317" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16203D" text-anchor="start">Share page link or image</text><text x="1017" y="356" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16203D" text-anchor="start">Download current image</text><text x="1017" y="395" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16203D" text-anchor="start">Load original if supported</text><polyline points="455,653 494,653 494,320 520,320" fill="none" stroke="#815AC0" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#head)"/><polyline points="455,731 478,731 478,469 976,469 976,320 985,320" fill="none" stroke="#3E82C9" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#head)"/><rect x="514" y="494" width="909" height="228" rx="22" fill="#E4F5EC" stroke="#398968" stroke-width="1.6"/><g transform="translate(542 526)" fill="none" stroke="#398968" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2H26V32L16 25L6 32Z"/></g><text x="590" y="551" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" fill="#16203D" text-anchor="start">What is actually saved?</text><text x="552" y="595" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#16203D" text-anchor="start">Pixiv bookmark → one remote Work, tied to an account.</text><text x="552" y="630" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#16203D" text-anchor="start">Local Work → one group reference, not five page bookmarks.</text><text x="552" y="665" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#16203D" text-anchor="start">Local Page → one Post identity, independent of the Work.</text><rect x="45" y="818" width="1390" height="49" rx="16" fill="#EEF3FF" stroke="#C8D3E7" stroke-width="1"/><text x="69" y="849" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#16203D" text-anchor="start">Familiar action icons + clear scope labels + divider. Avoid a second full toolbar.</text></svg>