<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="870" viewBox="0 0 1480 870" role="img" aria-labelledby="ttl dsc"><title id="ttl">From a source to the screen</title><desc id="dsc">The API supplies facts. Session state loads them. Shared UI displays them.</desc><defs><linearGradient id="bg" x2="0%" y2="100%"><stop offset="0%" stop-color="#FDFEFF"/><stop offset="100%" stop-color="#F3F7FF"/></linearGradient><marker id="head" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#16203D"/></marker></defs><rect width="1480" height="870" fill="url(#bg)"/><rect x="44" y="30" width="8" height="78" rx="4" fill="#3E82C9"/><text x="68" y="74" font-family="Arial,Helvetica,sans-serif" font-size="37" font-weight="700" fill="#16203D" text-anchor="start">From a source to the screen</text><text x="68" y="107" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#53617D" text-anchor="start">The API supplies facts. Session state loads them. Shared UI displays them.</text><rect x="1201" y="49" width="232" height="36" rx="16" fill="#EFE5FF" stroke="#815AC0" stroke-width="1.3"/><text x="1317" y="73" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#16203D" text-anchor="middle">DATA → UI</text><path d="M44 129H1435" stroke="#C8D3E7" stroke-width="1.5"/><rect x="56" y="177" width="400" height="575" rx="20" fill="#E0EEFF" stroke="#3E82C9" stroke-width="1.6"/><rect x="73" y="193" width="52" height="49" rx="14" fill="#FFFFFF" stroke="#3E82C9" stroke-width="1"/><g transform="translate(84 202)" fill="none" stroke="#3E82C9" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><path d="M1 10L16 2L31 10L16 18Z M1 18L16 26L31 18 M1 25L16 33L31 25"/></g><text x="140" y="228" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#16203D" text-anchor="start">1. Source data</text><rect x="540" y="177" width="400" height="575" rx="20" fill="#EFE5FF" stroke="#815AC0" stroke-width="1.6"/><rect x="557" y="193" width="52" height="49" rx="14" fill="#FFFFFF" stroke="#815AC0" stroke-width="1"/><g transform="translate(568 202)" fill="none" stroke="#815AC0" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="16" cy="16" r="11"/><circle cx="16" cy="16" r="4"/></g><text x="624" y="228" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#16203D" text-anchor="start">2. Application state</text><rect x="1024" y="177" width="400" height="575" rx="20" fill="#E4F5EC" stroke="#398968" stroke-width="1.6"/><rect x="1041" y="193" width="52" height="49" rx="14" fill="#FFFFFF" stroke="#398968" stroke-width="1"/><g transform="translate(1052 202)" fill="none" stroke="#398968" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><rect x="0" y="1" width="29" height="26" rx="4"/><circle cx="9" cy="9" r="2.5"/><path d="M3 23L11 15L16 19L21 12L27 24"/></g><text x="1108" y="228" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#16203D" text-anchor="start">3. Shared UI</text><rect x="82" y="270" width="348" height="100" rx="14" fill="#FFFFFF" stroke="#3E82C9" stroke-width="1.6"/><text x="106" y="304" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#16203D" text-anchor="start">Pixiv API</text><text x="106" y="337" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#53617D" text-anchor="start">Work ID, title, artist, page count</text><polyline points="255,371 255,411" fill="none" stroke="#3E82C9" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#head)"/><rect x="82" y="419" width="348" height="150" rx="15" fill="#FFFFFF" stroke="#3E82C9" stroke-width="1.6"/><text x="103" y="452" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#16203D" text-anchor="start">Engine adapter</text><text x="103" y="482" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#16203D" text-anchor="start">Create validated references</text><text x="103" y="509" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#16203D" text-anchor="start">and lightweight summaries.</text><text x="103" y="536" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#16203D" text-anchor="start">Load pages only when needed.</text><rect x="102" y="615" width="292" height="36" rx="16" fill="#FFFFFF" stroke="#3E82C9" stroke-width="1.3"/><text x="248" y="639" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#16203D" text-anchor="middle">No Widgets in source data</text><rect x="566" y="270" width="348" height="132" rx="15" fill="#FFFFFF" stroke="#815AC0" stroke-width="1.6"/><text x="589" y="304" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#16203D" text-anchor="start">Content Reference</text><text x="589" y="338" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#16203D" text-anchor="start">“Pixiv Work 120”</text><text x="589" y="363" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#16203D" text-anchor="start">Portable address, no credentials</text><rect x="566" y="430" width="348" height="140" rx="15" fill="#FFFFFF" stroke="#815AC0" stroke-width="1.6"/><text x="589" y="462" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#16203D" text-anchor="start">Group session</text><text x="589" y="495" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#16203D" text-anchor="start">Fetch requested members</text><text x="589" y="522" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#16203D" text-anchor="start">Keep profile access separate</text><text x="589" y="549" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#16203D" text-anchor="start">Track loading and errors</text><rect x="586" y="615" width="300" height="36" rx="16" fill="#FFFFFF" stroke="#815AC0" stroke-width="1.3"/><text x="736" y="639" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#16203D" text-anchor="middle">Temporary viewer state</text><rect x="1050" y="270" width="348" height="132" rx="15" fill="#FFFFFF" stroke="#398968" stroke-width="1.6"/><text x="1071" y="304" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#16203D" text-anchor="start">Work card in results</text><text x="1071" y="337" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#16203D" text-anchor="start">Cover, artist and page count</text><text x="1071" y="364" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#16203D" text-anchor="start">No full gallery fetch required</text><rect x="1050" y="430" width="348" height="140" rx="15" fill="#FFFFFF" stroke="#398968" stroke-width="1.6"/><text x="1071" y="463" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#16203D" text-anchor="start">Opened Work / Viewer</text><text x="1071" y="496" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#16203D" text-anchor="start">Shared Kurumi sections</text><text x="1071" y="523" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#16203D" text-anchor="start">Selected page + details</text><text x="1071" y="550" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#16203D" text-anchor="start">State survives page navigation</text><rect x="1072" y="615" width="298" height="36" rx="16" fill="#FFFFFF" stroke="#398968" stroke-width="1.3"/><text x="1221" y="639" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#16203D" text-anchor="middle">Reusable but adaptable UI</text><polyline points="455,473 531,473" fill="none" stroke="#16203D" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#head)"/><polyline points="940,473 1016,473" fill="none" stroke="#16203D" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#head)"/><rect x="45" y="793" width="1390" height="49" rx="16" fill="#EEF3FF" stroke="#C8D3E7" stroke-width="1"/><text x="69" y="824" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#16203D" text-anchor="start">One reference can appear in many lists, with independent viewing position and access.</text></svg>